<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Song Visuals</title>
<style>
:root{--bg:#120F26;--panel:#1B1736;--ink:#EDE8FF;--dim:#9A92C8;--amber:#F2B84B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:24px 16px;max-width:900px;margin-inline:auto}
h1{font-size:30px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
a.card{display:block;background:var(--panel);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;border:2px solid transparent}
a.card:hover,a.card:focus-visible{border-color:var(--amber);outline:none}
.th{aspect-ratio:16/9;background:linear-gradient(135deg,#2a2150,#14101B);display:flex;align-items:center;justify-content:center;font-size:44px}
.tx{padding:12px 14px}
.tx b{display:block;font-size:17px}
.tx span{color:var(--dim);font-size:13px}
.empty{border:2px dashed #3a3366;border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:170px;color:var(--dim);font-size:14px;text-align:center;padding:12px}
</style></head><body>
<h1>Song Visuals</h1>
<p class="sub">Pick a song to open its visuals. Play along to the song, or step through scene by scene to perform live.</p>
<div class="grid" id="g"></div>
<script>
// To add a song: copy a song folder under songs/, then add one line here.
var SONGS=[
 {name:"Ghammad Einak",artist:"Cairokee",path:"songs/ghammad-einak/",scenes:80,icon:"👁"}
];
var g=document.getElementById("g");
SONGS.forEach(function(s){
 var a=document.createElement("a");a.className="card";a.href=s.path;
 a.innerHTML='<div class="th">'+s.icon+'</div><div class="tx"><b></b><span></span></div>';
 a.querySelector("b").textContent=s.name;
 a.querySelector("span").textContent=s.artist+" · "+s.scenes+" scenes";
 g.appendChild(a);
});
var e=document.createElement("div");e.className="empty";e.textContent="More songs coming";g.appendChild(e);
</script></body></html>
