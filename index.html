<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Song Visuals</title>
<style>
:root{--bg:#121212;--card:#1E1E1E;--line:#2E2E2E;--ink:#F1F1F1;--mute:#A0A0A0;--acc:#E63946;--line-h:#444;--glow:0 0 28px rgba(230,57,70,.5);--spot:rgba(230,57,70,.28);--hd:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{min-height:100%;background:radial-gradient(900px 420px at 50% -140px,var(--spot),transparent 70%) no-repeat,var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
#app{max-width:1180px;margin:0 auto;padding:24px clamp(16px,4vw,44px) 70px}
h1{font:400 40px/1 var(--hd);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 6px;text-shadow:var(--glow)}
.sub{color:var(--mute);font-size:14px;margin:0 0 26px}
h2{font:400 21px/1.1 var(--hd);text-transform:uppercase;letter-spacing:.09em;margin:0 0 14px}
h2::before{content:'';display:inline-block;width:6px;height:18px;background:var(--acc);border-radius:2px;margin-right:10px;vertical-align:-2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .15s}
a.card:hover,a.card:focus-visible{border-color:var(--line-h);border-left-color:var(--acc);outline:none}
a.card:focus-visible{box-shadow:0 0 0 3px rgba(230,57,70,.28)}
.th{aspect-ratio:16/9;background:radial-gradient(300px 140px at 50% 0,rgba(230,57,70,.25),transparent 70%),#161616;display:flex;align-items:center;justify-content:center;font-size:44px}
.tx{padding:14px 16px}
.tx b{display:block;font-size:18px}
.tag{display:inline-block;margin-top:8px;font:700 10px/1 inherit;letter-spacing:.12em;text-transform:uppercase;background:var(--acc);color:#fff;border-radius:99px;padding:4px 9px}
.mute{color:var(--mute);font-size:14px}
.empty{border:1px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:170px;color:var(--mute);font-size:14px;padding:12px;text-align:center}
</style></head><body><div id="app">
<a href="https://deobandofficial.github.io/deoband/" style="color:#A0A0A0;font-size:13px;text-decoration:none">← Deo Band</a>
<h1>Song Visuals</h1>
<p class="sub">Pick a song. Step through it scene by scene to perform live, or play the track and the visuals move with it.</p>
<h2>Songs</h2>
<div class="grid" id="g"></div>
</div>
<script>
// To add a song: copy a song folder under songs/, then add one line below.
var SONGS=[
 {name:"Ghammad Einak",artist:"Cairokee",path:"songs/ghammad-einak/",scenes:80,icon:"👁"},
 {name:"Die With a Smile",artist:"Lady Gaga & Bruno Mars",path:"songs/die-with-a-smile/",scenes:32,icon:"🌙",live:true}
];
var g=document.getElementById("g");
SONGS.forEach(function(s){
 var a=document.createElement("a");a.className="card";a.href=s.path;
 a.innerHTML='<div class="th"></div><div class="tx"><b></b><span class="mute"></span><div><span class="tag">Open</span></div></div>';
 a.querySelector(".th").textContent=s.icon;
 a.querySelector("b").textContent=s.name;
 a.querySelector(".mute").textContent=s.artist+" · "+s.scenes+" scenes"+(s.live?" · live mode":"");
 g.appendChild(a);
});
var e=document.createElement("div");e.className="empty";e.textContent="More songs coming";g.appendChild(e);
</script></body></html>
